<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp · MI.COM.CO</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23059669'/%3E%3Ctext x='16' y='21' text-anchor='middle' fill='white' font-size='11' font-family='Arial' font-weight='700'%3EMI%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
    </script>
    <style>
        body { font-family: Inter, system-ui, sans-serif; }
        .wallpaper {
            background-color: #efeae2;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(16, 185, 129, 0.05), transparent 28%),
                radial-gradient(circle at 80% 0%, rgba(15, 118, 110, 0.06), transparent 24%);
        }
        audio { height: 36px; width: 220px; }
        #toast { transition: opacity 180ms ease, transform 180ms ease; }
    </style>
</head>
<body class="h-screen overflow-hidden bg-zinc-200 text-slate-800">
    <div id="toast" class="pointer-events-none fixed left-1/2 top-5 z-50 hidden -translate-x-1/2 rounded-full bg-slate-900 px-4 py-2 text-sm text-white shadow-lg"></div>

    <div id="triage" class="fixed inset-0 z-40 flex items-center justify-center bg-slate-900/45 p-4 backdrop-blur-sm">
        <form id="triage-form" class="w-full max-w-md rounded-3xl border border-white bg-white p-7 shadow-2xl">
            <p class="text-xs font-semibold uppercase tracking-[0.16em] text-emerald-700">MI.COM.CO</p>
            <h1 class="mt-2 text-2xl font-semibold tracking-tight text-slate-900">Antes de escribirnos</h1>
            <p class="mt-1 text-sm text-slate-500">Necesitamos estos datos para abrir el chat con el equipo correcto.</p>
            <label class="mt-5 block text-sm font-medium text-slate-700">Nombre
                <input name="name" required maxlength="120" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none ring-emerald-500/30 focus:ring-4" placeholder="Tu nombre">
            </label>
            <label class="mt-3 block text-sm font-medium text-slate-700">Dominio
                <input name="domain" required maxlength="160" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none ring-emerald-500/30 focus:ring-4" placeholder="midominio.com">
            </label>
            <label class="mt-3 block text-sm font-medium text-slate-700">Correo Mi.com.co
                <input name="email_micomco" type="email" required maxlength="160" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none ring-emerald-500/30 focus:ring-4" placeholder="cliente@mi.com.co">
            </label>
            <label class="mt-3 block text-sm font-medium text-slate-700">Falla o motivo
                <textarea name="reason" required maxlength="4000" rows="4" class="mt-1 w-full resize-none rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none ring-emerald-500/30 focus:ring-4" placeholder="Cuéntanos qué ocurre"></textarea>
            </label>
            <p id="triage-error" class="mt-3 hidden whitespace-pre-wrap text-sm text-rose-600"></p>
            <button id="triage-submit" type="submit" class="mt-4 w-full rounded-xl bg-emerald-600 py-2.5 text-sm font-semibold text-white hover:bg-emerald-700">Abrir chat</button>
        </form>
    </div>

    <main class="mx-auto flex h-full max-w-3xl flex-col bg-white shadow-xl">
        <header class="flex items-center gap-3 bg-emerald-700 px-4 py-3 text-white">
            <div class="grid h-10 w-10 place-items-center rounded-full bg-emerald-500/40 text-sm font-semibold">MI</div>
            <div class="min-w-0 flex-1">
                <p class="truncate text-sm font-semibold">Soporte MI.COM.CO</p>
                <p id="presence" class="text-xs text-emerald-100">En línea</p>
            </div>
            <a href="/crm" class="rounded-full bg-white/10 px-3 py-1 text-xs font-medium hover:bg-white/20">CRM</a>
        </header>
        <section id="thread" class="wallpaper flex-1 space-y-2 overflow-y-auto px-3 py-4 sm:px-5"></section>
        <div id="closed-banner" class="hidden border-t border-amber-200 bg-amber-50 px-4 py-2 text-center text-sm text-amber-800">
            Este chat está cerrado.
            <button id="new-chat" type="button" class="ml-1 font-semibold underline">Abrir uno nuevo</button>
        </div>
        <form id="composer" class="flex items-end gap-2 border-t border-slate-200 bg-zinc-100 px-3 py-2.5">
            <input id="file" type="file" accept="audio/ogg,audio/mpeg,audio/mp3,audio/wav,.ogg,.mp3,.wav,.gif,.webp" class="hidden">
            <button id="attach" type="button" class="grid h-11 w-11 place-items-center rounded-full text-slate-500 hover:bg-white" aria-label="Adjuntar nota de voz">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21.4 11.05 12.25 20.2a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.82-2.83l8.48-8.48"/></svg>
            </button>
            <textarea id="input" rows="1" placeholder="Escribe un mensaje" class="max-h-32 flex-1 resize-none rounded-2xl border border-transparent bg-white px-4 py-3 text-sm outline-none focus:border-emerald-300"></textarea>
            <button id="send" type="submit" class="grid h-11 w-11 place-items-center rounded-full bg-emerald-600 text-white hover:bg-emerald-700" aria-label="Enviar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 11.2 20.2 3.5c.8-.4 1.7.5 1.3 1.3l-7.7 16.8c-.4.9-1.7.8-2-.2l-1.6-5.4-5.4-1.6c-1-.3-1.1-1.6-.4-2.2Z"/></svg>
            </button>
        </form>
    </main>

    <script>
        const thread = document.getElementById('thread');
        const triage = document.getElementById('triage');
        const presence = document.getElementById('presence');
        const input = document.getElementById('input');
        const fileInput = document.getElementById('file');
        const closedBanner = document.getElementById('closed-banner');
        let ticketId = localStorage.getItem('micomco_ticket_id');
        let sending = false;
        let known = '';

        function toast(text) {
            const node = document.getElementById('toast');
            node.textContent = text;
            node.classList.remove('hidden');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => node.classList.add('hidden'), 3200);
        }

        function clock(iso) {
            const date = new Date(iso);
            if (Number.isNaN(date.getTime())) return '';
            return date.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
        }

        function render(payload) {
            const ticket = payload.ticket;
            const messages = payload.messages || [];
            presence.textContent = ticket.department_name + ' · ' + labelStatus(ticket.status);
            closedBanner.classList.toggle('hidden', ticket.status !== 'cerrado');
            const signature = JSON.stringify(messages.map((item) => item.id));
            if (signature === known) return;
            known = signature;
            thread.replaceChildren();
            messages.forEach((message) => {
                const mine = message.sender_type === 'client';
                const row = document.createElement('div');
                row.className = 'flex ' + (mine ? 'justify-end' : 'justify-start');
                const bubble = document.createElement('div');
                bubble.className = 'max-w-[80%] rounded-2xl px-3 py-2 text-sm shadow-sm ' + (mine
                    ? 'rounded-br-md bg-emerald-600 text-white'
                    : 'rounded-bl-md bg-white text-slate-800');
                if (message.media_type === 'audio' && message.media_url) {
                    const audio = document.createElement('audio');
                    audio.controls = true;
                    audio.preload = 'none';
                    audio.src = message.media_url;
                    bubble.appendChild(audio);
                }
                if (message.content && !(message.media_type === 'audio' && message.content === 'Nota de voz')) {
                    const text = document.createElement('p');
                    text.className = 'whitespace-pre-wrap leading-relaxed';
                    text.textContent = message.content;
                    bubble.appendChild(text);
                }
                const meta = document.createElement('p');
                meta.className = 'mt-1 text-[11px] ' + (mine ? 'text-emerald-100' : 'text-slate-400');
                meta.textContent = (message.author_name ? message.author_name + ' · ' : '') + clock(message.created_at);
                bubble.appendChild(meta);
                row.appendChild(bubble);
                thread.appendChild(row);
            });
            thread.scrollTop = thread.scrollHeight;
        }

        function labelStatus(status) {
            const names = {
                nuevo: 'nuevo',
                en_bot: 'asistente',
                esperando_agente: 'esperando agente',
                en_proceso: 'con un agente',
                resuelto: 'resuelto',
                cerrado: 'cerrado'
            };
            return names[status] || status;
        }

        async function readError(response) {
            try {
                const body = await response.json();
                return body.detail || 'No se pudo completar la solicitud.';
            } catch (_err) {
                return 'No se pudo completar la solicitud.';
            }
        }

        async function refresh() {
            if (!ticketId) return;
            const response = await fetch('/api/client/tickets/' + ticketId);
            if (response.status === 404) {
                localStorage.removeItem('micomco_ticket_id');
                ticketId = null;
                triage.classList.remove('hidden');
                return;
            }
            if (!response.ok) return;
            const payload = await response.json();
            triage.classList.add('hidden');
            render(payload);
        }

        document.getElementById('triage-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const form = event.currentTarget;
            const error = document.getElementById('triage-error');
            const button = document.getElementById('triage-submit');
            error.classList.add('hidden');
            button.disabled = true;
            const body = Object.fromEntries(new FormData(form).entries());
            try {
                const response = await fetch('/api/client/triage', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!response.ok) {
                    error.textContent = await readError(response);
                    error.classList.remove('hidden');
                    return;
                }
                const payload = await response.json();
                ticketId = payload.ticket.id;
                localStorage.setItem('micomco_ticket_id', ticketId);
                known = '';
                triage.classList.add('hidden');
                render(payload);
            } finally {
                button.disabled = false;
            }
        });

        document.getElementById('composer').addEventListener('submit', async (event) => {
            event.preventDefault();
            await send(input.value, null);
        });

        input.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                document.getElementById('composer').requestSubmit();
            }
        });

        document.getElementById('attach').addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', async () => {
            const file = fileInput.files && fileInput.files[0];
            fileInput.value = '';
            if (!file) return;
            const mime = (file.type || '').toLowerCase();
            const name = (file.name || '').toLowerCase();
            if (mime === 'image/gif' || mime === 'image/webp' || name.endsWith('.gif') || name.endsWith('.webp')) {
                toast('No aceptamos stickers ni GIFs. Envía texto o una nota de voz.');
                return;
            }
            await send(input.value, file);
        });

        document.getElementById('new-chat').addEventListener('click', () => {
            localStorage.removeItem('micomco_ticket_id');
            ticketId = null;
            known = '';
            thread.replaceChildren();
            closedBanner.classList.add('hidden');
            triage.classList.remove('hidden');
        });

        async function send(text, file) {
            if (!ticketId || sending) return;
            const content = (text || '').trim();
            if (!content && !file) return;
            sending = true;
            document.getElementById('send').disabled = true;
            try {
                const payload = { ticket_id: ticketId, content };
                if (file) {
                    payload.mime_type = file.type || '';
                    payload.filename = file.name || '';
                    payload.media_base64 = await readFile(file);
                }
                const response = await fetch('/api/client/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (response.status === 409) {
                    toast(await readError(response));
                    localStorage.removeItem('micomco_ticket_id');
                    ticketId = null;
                    triage.classList.remove('hidden');
                    return;
                }
                if (response.status === 415) {
                    toast(await readError(response));
                    return;
                }
                if (!response.ok) {
                    toast(await readError(response));
                    return;
                }
                input.value = '';
                known = '';
                render(await response.json());
            } finally {
                sending = false;
                document.getElementById('send').disabled = false;
            }
        }

        function readFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(String(reader.result || ''));
                reader.onerror = () => reject(reader.error);
                reader.readAsDataURL(file);
            });
        }

        if (ticketId) {
            triage.classList.add('hidden');
            refresh();
        }
        setInterval(refresh, 3000);
    </script>
</body>
</html>
