[package]
name = "micomco-rag"
version = "1.0.0"
edition = "2021"
rust-version = "1.83"
description = "Asistente RAG de MI.COM.CO: Axum, Chroma y Claude"
publish = false

# Versiones fijadas para el toolchain Rust 1.83 de este entorno.
[dependencies]
axum = "=0.7.9"
chrono = "=0.4.38"
chrono-tz = "=0.10.0"
clap = { version = "=4.5.21", features = ["derive"] }
dotenvy = "=0.15.7"
fancy-regex = "=0.14.0"
futures-util = "=0.3.31"
regex = "=1.11.1"
reqwest = { version = "=0.12.9", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots-no-provider"] }
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.133"
sha2 = "=0.10.8"
tera = "=1.19.1"
thiserror = "=1.0.69"
tokio = { version = "=1.41.1", features = ["full"] }
tower-http = { version = "=0.6.2", features = ["fs"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter"] }
uuid = { version = "=1.11.0", features = ["v4"] }

# El resolver sube dependencias transitivas a ediciones que Rust 1.83 no puede leer.
# Estas igualdades mantienen la línea compatible con el toolchain del entorno.
cc = "=1.1.31"
chacha20 = "=0.9.1"
cpufeatures = "=0.2.16"
getrandom = "=0.2.15"
globset = "=0.4.15"
hyper = { version = "=1.5.2", default-features = false }
hyper-rustls = { version = "=0.27.3", default-features = false }
hyper-util = { version = "=0.1.10", default-features = false }
idna = "=1.0.3"
idna_adapter = "=1.2.0"
ignore = "=0.4.23"
jobserver = "=0.1.32"
rand = "=0.8.5"
rustls = { version = "=0.23.19", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.1", default-features = false, features = ["ring", "tls12"] }
unicode-segmentation = "=1.12.0"
url = "=2.5.2"
webpki-roots = "=0.26.7"
zeroize = "=1.8.1"

[dev-dependencies]
http-body-util = "=0.1.2"
tower = { version = "=0.5.1", features = ["util"] }
