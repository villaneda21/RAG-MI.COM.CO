[package]
name = "rag-micomco"
version = "1.0.0"
edition = "2021"
description = "Asistente RAG de MI.COM.CO (Axum + Tokio)"
publish = false
default-run = "rag-micomco"

[dependencies]
async-trait = "0.1"
axum = { version = "0.7.9", features = ["multipart"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
fastembed = { version = "=7.1.2", optional = true, default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
futures-util = "0.3"
hex = "0.4"
regex = "1.11"
fancy-regex = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
tera = "1.20"
thiserror = "2"
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

[features]
default = ["semantic-embeddings"]
semantic-embeddings = ["dep:fastembed"]

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.14"
tower = { version = "0.5", features = ["util"] }
