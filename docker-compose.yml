services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "lc_messages=C"]
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag_micomco
    ports:
      - "5433:5432"
    volumes:
      - helpdesk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_micomco"]
      interval: 5s
      timeout: 5s
      retries: 20

  micomco_backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://rag:rag@postgres:5432/rag_micomco?sslmode=disable
      HOST: 0.0.0.0
      PORT: "8000"
      RAG_PROJECT_ROOT: /app
      CRM_SECRET_TOKEN: ${CRM_SECRET_TOKEN:-demo-crm-token}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - micomco_chroma:/app/chroma_db
      - micomco_cache:/app/.cache

volumes:
  helpdesk_pg:
  micomco_chroma:
  micomco_cache:
